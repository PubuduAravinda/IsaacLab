seed: 42

models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]  # Reduced size
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]  # Reduced size
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 4096              # Increased for better sampling
  learning_epochs: 10         # Increased for better learning
  mini_batches: 32            # Increased for better gradient estimates
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-4       # Reduced for stability
  learning_rate_scheduler: null  # Remove adaptive LR for now
  state_preprocessor: null
  value_preprocessor: null
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.01
  value_loss_scale: 0.5
  experiment:
    directory: "go1_flat_direct"
    experiment_name: "go1_flat_fixed"
    write_interval: auto
    checkpoint_interval: 1000

trainer:
  class: SequentialTrainer
  timesteps: 20000000
  environment_info: log

