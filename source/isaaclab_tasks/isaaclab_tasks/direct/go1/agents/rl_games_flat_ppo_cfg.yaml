# agents/rl_games_flat_ppo_cfg.yaml - CORRECTED per HIMLoco recommendations

params:
  seed: 42

  env:
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0.0
        fixed_sigma: True

    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: go1_flat_himloco
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1

    reward_shaper:
      scale_value: 0.1

    normalize_advantage: True
    gamma: 0.99
    tau: 0.95

    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.016

    score_to_win: 20000
    max_epochs: 2000  # ← CRITICAL: HIMLoco recommends max 2000!
    save_best_after: 50
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2

    horizon_length: 24
    minibatch_size: 1080
    mini_epochs: 5
    critic_coef: 2.0
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001