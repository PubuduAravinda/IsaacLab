params:
  seed: 42

  env:
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0.0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]  # Exact HIMLoco policy MLP
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: go1_flat_direct  # Change to go1_rough_direct for your rough config
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True    # Essential for stable training with proprio obs
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.6
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.01
    score_function: common
    e_clip: 0.2
    entropy_coef: 0.01      # Matches HIMLoco paper
    clip_value: True
    bounds_loss_coef: 0.0
    grad_norm: 10.0         # Matches HIMLoco clipping
    horizon_length: 100     # 100 policy steps per rollout (~2s episode)
    minibatch_size: 8192    # ~50 minibatches per update with 4096 envs
    mini_epochs: 5
    critic_coef: 1.0
    max_epochs: 10000       # ADDED: Large number for long training (e.g., 10k updates ≈ billions of steps)
    save_frequency: 500     # Optional: Save checkpoint every 500 updates
    truncate_screenshots: True
    full_experiment_name: go1_flat_himloco  # Optional: Better logging folder name